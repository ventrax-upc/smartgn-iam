services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: smartgn_iam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a database password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [iam_pgdata:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartgn_iam -d iam_db"]
      interval: 3s
      timeout: 3s
      retries: 30
  iam:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/iam_db
      DB_USERNAME: smartgn_iam
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set service credential}
      DELIVERY_ENCRYPTION_KEY: ${DELIVERY_ENCRYPTION_KEY:?Set delivery key}
      INSTALLATION_BASE_URL: ${INSTALLATION_BASE_URL:-http://host.docker.internal:8081}
      SMARTGN_BILLING_BASE_URL: ${BILLING_BASE_URL:-http://host.docker.internal:8083}
      SMARTGN_BILLING_SERVICE_TOKEN: ${BILLING_SERVICE_TOKEN:-${INTERNAL_SERVICE_TOKEN}}
      NOTIFICATION_DELIVERY_URL: ${NOTIFICATION_DELIVERY_URL:-}
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-${INTERNAL_SERVICE_TOKEN}}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  iam_pgdata:
