services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: smartgn_iam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a database password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [iam_pgdata:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartgn_iam -d iam_db"]
      interval: 3s
      timeout: 3s
      retries: 30
  iam:
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/iam_db
      DB_USERNAME: smartgn_iam
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  iam_pgdata:
