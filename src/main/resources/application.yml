spring:
  application:
    name: smartgn-iam-service
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:${SMARTGN_CONFIG_URL:http://config:8088}}
  boot:
    admin:
      client:
        url: ${SMARTGN_ADMIN_URL:http://admin:8089}
        username: ${SMARTGN_ADMIN_USERNAME:smartgn}
        password: ${SMARTGN_ADMIN_PASSWORD:}
        instance:
          service-url: ${ADMIN_SERVICE_URL:http://iam:8080}
          management-url: ${ADMIN_MANAGEMENT_URL:http://iam:8080/actuator}
          health-url: ${ADMIN_HEALTH_URL:http://iam:8080/actuator/health}
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iam_db}
    username: ${DB_USERNAME:smartgn_iam}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    schemas: iam
    default-schema: iam
    create-schemas: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

smartgn:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    # Frontend URL to which ?token=... is appended
    link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:http://localhost:4200/reset-password}

  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
  delivery:
    key: ${DELIVERY_ENCRYPTION_KEY}
    url: ${NOTIFICATION_DELIVERY_URL:}
    token: ${NOTIFICATION_SERVICE_TOKEN:}
  installation:
    url: ${INSTALLATION_BASE_URL:http://installation:8081}
  billing:
    base-url: ${BILLING_BASE_URL:${BILLING_FIXTURE_URL:}}
    service-token: ${BILLING_SERVICE_TOKEN:${BILLING_FIXTURE_TOKEN:}}
    fixture-url: ${BILLING_FIXTURE_URL:}
    fixture-token: ${BILLING_FIXTURE_TOKEN:}
